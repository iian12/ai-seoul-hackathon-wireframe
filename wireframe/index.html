<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울사이 UI/UX</title><style>
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1c1c1a;background:#f6f6f3}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e3de;padding:14px 24px;display:flex;gap:24px;align-items:center;z-index:2}
header strong{font-size:18px} header a{color:#1c1c1a;text-decoration:none;font-size:15px} header a:hover{text-decoration:underline}
main{max-width:1200px;margin:0 auto;padding:24px}
h2{font-size:26px;margin:40px 0 16px} h3{font-size:17px;margin:0 0 12px}
.board{background:#fff;border:1px solid #e3e3de;border-radius:10px;padding:20px;margin:0 0 24px}
.board img{width:100%;height:auto;display:block;border:1px solid #eee}
.board.mobile img{max-width:390px}
.note{font-size:14px;line-height:1.65;margin:14px 0 0;color:#3a3a36}
</style></head><body><header><strong>서울사이 UI/UX</strong><a href="#wf">와이어프레임</a><a href="#ly">레이아웃</a></header><main><section id="wf"><h2>와이어프레임</h2><figure class="board"><a href="img/wf_0.jpg" target="_blank"><img src="img/wf_0.jpg" alt="1. 첫 화면 (데스크톱)" loading="lazy"></a><p class="note">1. 첫 화면<br>① 화면 설정: 큰 글씨·고대비. 어느 화면에서나 켜고 끌 수 있고 다음 방문에도 유지<br>② 3D 서울 모형(WebGL): 추천 TOP 3 핀, 드래그 회전·휠 확대, 약 2.8km 높이에서 내려다보며 시작<br>③ 예시 결과 카드: 보증금 1,000만·월세 65만 원으로 미리 계산한 1위, ‘이 조건으로 보기’로 바로 결과<br>④ 헤드라인과 한 줄 소개: 무엇을 하는 서비스인지 한 번에<br>⑤ 조건 넣기 카드: ‘직접 입력 / 말로 찾기’ 탭, 월세·전세, 보증금·월세(만 원), 상황 선택<br>⑥ 예시로 채우기 칩: 사회초년생 1,000/65 · 대학생 500/50 · 전세 3억<br>⑦ 주 버튼 ‘동네 찾기’, 보조 ‘지도 먼저 보기’</p></figure><figure class="board"><a href="img/wf_1.jpg" target="_blank"><img src="img/wf_1.jpg" alt="2. 결과 화면 (데스크톱)" loading="lazy"></a><p class="note">2. 결과 화면<br>① 내 조건 요약 칩과 ‘조건 바꾸기 / 처음부터’. 펼치면 상황·항목별 중요도·학교·직장 반경 설정<br>② 읽어주기(TOP 3 음성)·공유(같은 조건 링크)<br>③ 추천 카드 3장: 순위, 동네 이름, 구·역까지 도보 시간, 한 줄 이유, 월세 중간값, 점수와 별점<br>④ 동네 이름 검색<br>⑤ 동네 경계를 눌러 선택, 흰 점은 동네별 기준역. 예산 안 후보 동네는 옅게 칠함<br>⑥ 범례: 추천 동네 · 동네 기준역 · 예산 안 후보 동네<br>⑦ 휠 확대·축소, +/− 버튼, 서울 전체 보기</p></figure><figure class="board"><a href="img/wf_2.jpg" target="_blank"><img src="img/wf_2.jpg" alt="3. 동네 리포트 (데스크톱)" loading="lazy"></a><p class="note">3. 동네 리포트<br>① 목록으로 돌아가기<br>② 동네 이름 → 구·역까지 도보 시간, 종합 점수<br>③ 이런 분께 맞아요 / 확인해 보세요<br>④ 항목별 점수 막대 4개(밤길 안전·교통·주거비·병원·약국)<br>⑤ 생활 정보: 역 도보 거리, 버스정류장, 안심시설·병원·약국 수, 밤늦게 여는 약국, 응급실<br>⑥ 시세: 동네 월세 중간값, 예산 맞는 계약 비율<br>⑦ 지도: 동네 경계 강조, 출입구까지 실제 도보 경로, 기준역 점</p></figure><figure class="board mobile"><a href="img/wf_3.jpg" target="_blank"><img src="img/wf_3.jpg" alt="4. 말로 찾기 상태" loading="lazy"></a></figure><figure class="board mobile"><a href="img/wf_4.jpg" target="_blank"><img src="img/wf_4.jpg" alt="5. 결과 없음 상태" loading="lazy"></a><p class="note">4. 말로 찾기<br>① ‘말로 찾기’ 탭<br>② 말하거나 적는 칸과 마이크(듣는 중에는 강조)<br>③ 알아들은 조건을 칩으로 먼저 보여 줌 — 확인 전에는 적용하지 않음<br>④ ‘이 조건으로 찾기’. 빠진 값은 결과 화면 입력칸에서 오류로 안내<br><br>5. 결과 없음<br>① 지금 조건 요약<br>② 왜 없는지 한 문장 + 추천이 나오는 예산·반경을 버튼으로 제안<br>③ 빠진 동네를 이유별 개수로 묶어 펼쳐 보기</p></figure><figure class="board mobile"><a href="img/wf_5.jpg" target="_blank"><img src="img/wf_5.jpg" alt="6. 첫 화면 (모바일)" loading="lazy"></a></figure><figure class="board mobile"><a href="img/wf_6.jpg" target="_blank"><img src="img/wf_6.jpg" alt="7. 결과 화면 (모바일)" loading="lazy"></a><p class="note">6·7. 모바일 (900px 이하)<br>① 메뉴는 숨기고 큰 글씨·고대비만 남김, 머리글은 위에 고정<br>② 3D 모형·지도는 화면 위쪽(높이 약 40%), 내용은 아래로 이어짐<br>③ 조건 카드·추천 목록은 한 줄로 쌓임, 버튼은 손가락 크기(44px 이상)<br>④ 주 버튼은 카드 폭 전체</p></figure></section><section id="ly"><h2>레이아웃</h2><figure class="board"><a href="img/ly_0.jpg" target="_blank"><img src="img/ly_0.jpg" alt="A. 첫 화면 영역 (1440×900)" loading="lazy"></a><p class="note">A. 첫 화면은 스크롤 없는 한 장(높이 100svh)<br>· 파랑 = 고정 영역, 주황 = 지도 위에 뜨는 카드<br>· 3D 지도: 왼쪽 0, 너비 66%, 머리글 아래부터 바닥까지. 오른쪽 76%~99%, 아래 88%~100% 구간을 바탕색으로 흐림<br>· 제목 블록: 오른쪽 28px, 위 머리글+4vh, 너비 min(540px, 40vw), 오른쪽 정렬<br>· 예시 결과 카드 288px(왼쪽 아래 20px), 조건 넣기 카드 min(430px, 100vw−40px)(오른쪽 아래 20px)<br>· 1100px 이하: 예시 결과 카드 숨김, 지도 너비 60%</p></figure><figure class="board"><a href="img/ly_1.jpg" target="_blank"><img src="img/ly_1.jpg" alt="B. 결과 화면 영역 (1440×900)" loading="lazy"></a><p class="note">B. 결과 화면도 한 장(100svh): 왼쪽 목록만 스크롤, 문서 전체는 스크롤되지 않음<br>· 그리드: 왼쪽 패널 minmax(340px, 384px) + 지도 1fr<br>· 패널 안쪽 여백 14px 16px 24px, 카드 사이 8~12px<br>· 지도 위 요소: 동네 검색(위 가운데), 나침반·축척(왼쪽 위), 확대 +/−·전체 보기(오른쪽 위), 범례(왼쪽 아래)<br>· 지도 층(아래→위): 타일 → 도보 경로·선택 경계 → 동네 영역(캔버스) → 서울 밖 가림 → 구 이름 → 기준역 점 → 추천 핀</p></figure><figure class="board mobile"><a href="img/ly_2.jpg" target="_blank"><img src="img/ly_2.jpg" alt="C. 첫 화면 (390, 900px 이하)" loading="lazy"></a></figure><figure class="board mobile"><a href="img/ly_3.jpg" target="_blank"><img src="img/ly_3.jpg" alt="D. 결과 화면 (390, 900px 이하)" loading="lazy"></a></figure><figure class="board"><a href="img/ly_4.jpg" target="_blank"><img src="img/ly_4.jpg" alt="E. 치수·글자·색·브레이크포인트" loading="lazy"></a></figure></section></main></body></html>
